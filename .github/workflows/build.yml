name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BIN_NAME: sylk

jobs:
  verify:
    name: Verify (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux Build Dependencies
        if: startsWith(matrix.target.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install macOS Build Dependencies
        if: startsWith(matrix.target.runner, 'macos-')
        run: brew install --cask macfuse

      - name: Build Command Packages
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: go build ./cmd/...

      - name: Build PureVFS
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: go build ./core/purevfs

      - name: Run Tree-Sitter Tests
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test ./core/treesitter/...

  package:
    name: Package (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux Build And Packaging Dependencies
        if: startsWith(matrix.target.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm

      - name: Install macOS Build Dependencies
        if: startsWith(matrix.target.runner, 'macos-')
        run: brew install --cask macfuse

      - name: Build Release Artifacts
        env:
          BIN_NAME: ${{ env.BIN_NAME }}
          DIST_DIR: ${{ github.workspace }}/dist
          GOCACHE: ${{ runner.temp }}/go-build
          TARGET_ARCH: ${{ matrix.target.goarch }}
          TARGET_OS: ${{ matrix.target.goos }}
          VERSION: ${{ github.ref_name }}
        run: bash ./scripts/ci/build-release.sh

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sylk-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/*

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
          pattern: sylk-*

      - name: Consolidate Checksums
        run: |
          shopt -s nullglob
          cat dist/*_SHA256SUMS.txt | sort -k2 > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
