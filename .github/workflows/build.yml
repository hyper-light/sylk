name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: sylk

# Serialize runs on main so version bumps don't race. Don't cancel — every
# successful run produces a release we want to keep.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: true
      matrix:
        target:
          - { runner: ubuntu-24.04,     goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64 }
          - { runner: macos-15,         goos: darwin,  goarch: arm64 }
          - { runner: windows-2022,     goos: windows, goarch: amd64 }

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux Build Dependencies
        if: matrix.target.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfuse-dev libfuse3-dev

      - name: Install macOS Build Dependencies
        if: matrix.target.goos == 'darwin'
        run: brew install --cask macfuse

      - name: Install Windows Build Dependencies (WinFsp)
        if: matrix.target.goos == 'windows'
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          $winfspInc = "C:\Program Files (x86)\WinFsp\inc\fuse"
          if (-not (Test-Path $winfspInc)) {
            Write-Error "WinFsp headers not found at $winfspInc"
            exit 1
          }
          "CPATH=$winfspInc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Go Vet
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: go vet ./...

      - name: Go Test
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test ./...

  version:
    name: Compute Next Version
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute Next Tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [[ -z "$last" ]]; then
            next="v0.0.1"
          else
            IFS='.' read -r maj min pat <<< "${last#v}"
            next="v${maj}.${min}.$((pat + 1))"
          fi
          echo "Last tag: ${last:-<none>}"
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    needs: version
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: true
      matrix:
        target:
          - { runner: ubuntu-24.04,     goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64 }
          - { runner: macos-15,         goos: darwin,  goarch: arm64 }
          - { runner: windows-2022,     goos: windows, goarch: amd64 }

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux Build And Packaging Dependencies
        if: matrix.target.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfuse-dev libfuse3-dev rpm

      - name: Install macOS Build Dependencies
        if: matrix.target.goos == 'darwin'
        run: brew install --cask macfuse

      - name: Install Windows Build Dependencies (WinFsp)
        if: matrix.target.goos == 'windows'
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          $winfspInc = "C:\Program Files (x86)\WinFsp\inc\fuse"
          if (-not (Test-Path $winfspInc)) {
            Write-Error "WinFsp headers not found at $winfspInc"
            exit 1
          }
          "CPATH=$winfspInc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Release Artifacts
        shell: bash
        env:
          BIN_NAME: ${{ env.BIN_NAME }}
          DIST_DIR: ${{ github.workspace }}/dist
          GOCACHE: ${{ runner.temp }}/go-build
          TARGET_OS: ${{ matrix.target.goos }}
          TARGET_ARCH: ${{ matrix.target.goarch }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: bash ./scripts/ci/build-release.sh

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sylk-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
          pattern: sylk-*

      - name: Consolidate Checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(dist/*_SHA256SUMS.txt)
          if (( ${#checksums[@]} > 0 )); then
            cat "${checksums[@]}" | sort -k2 > dist/SHA256SUMS.txt
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
